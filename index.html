<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120a20">
  <title>Прокляття загублених подарунків</title>
  <link rel="icon" href="assets/bublik.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Philosopher:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <h1 id="title">Прокляття загублених подарунків</h1>
    <div id="kid-badge" class="kid-badge" hidden></div>
  </header>
  <main id="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="overlay" class="overlay" hidden></div>
  <dialog id="adult" class="adult">
    <h2>Для дорослого</h2>
    <p id="adult-status"></p>
    <p class="small">Аварійний код: у полі відповіді введіть <b>БУБЛИК</b> і номер етапу, напр. <b>БУБЛИК7</b>.</p>
    <div class="row">
      <button id="adult-reset" class="btn danger" type="button">Почати знову</button>
      <button id="adult-close" class="btn ghost" type="button">Закрити</button>
    </div>
  </dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
